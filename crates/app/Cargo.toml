[package]
name = "reshift"
description = "ReShift for Windows - converts text typed in the wrong keyboard layout"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "ReShift"
path = "src/main.rs"

[dependencies]
reshift-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_Media_Audio", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_HiDpi"] }

[lints]
workspace = true
